<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pico CP/M Web Terminal (Modal Controls)</title>
  <style>
    * { box-sizing: border-box; }

    /* CSS Theme Variables (Defaults to Green) */
    :root {
      --term-color: #00ff00;
      --term-dim: #005500;
      --term-glow: rgba(0, 255, 0, 0.3);
      --term-glow-bright: rgba(0, 255, 0, 0.8);
    }

    /* Color Themes */
    body.theme-amber {
      --term-color: #ffb000;
      --term-dim: #885500;
      --term-glow: rgba(255, 176, 0, 0.3);
      --term-glow-bright: rgba(255, 176, 0, 0.8);
    }

    body.theme-white {
      --term-color: #e0e0e0;
      --term-dim: #666666;
      --term-glow: rgba(224, 224, 224, 0.3);
      --term-glow-bright: rgba(224, 224, 224, 0.8);
    }

    html, body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 10px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Outer Container */
    .terminal-container {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      outline: none;
    }

    /* SVG Monitor Screen with Bezel */
    svg {
      max-width: 100%;
      max-height: 100%;
      background-color: #000000;
      border: 3px solid #444444;
      border-radius: 6px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.9), inset 0 0 10px rgba(0, 0, 0, 0.8);
      outline: none;
    }

    text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 16px;
      fill: var(--term-color);
      white-space: pre;
    }

    .cursor {
      fill: var(--term-color);
      animation: blink 1s infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* Modal Backdrop */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease-in-out;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Retro Terminal Modal Window */
    .modal-box {
      background-color: #0a0a0a;
      border: 2px solid var(--term-color);
      border-radius: 4px;
      padding: 24px 30px;
      width: 380px;
      box-shadow: 0 0 25px var(--term-glow), inset 0 0 10px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      gap: 16px;
      font-family: 'Courier New', Courier, monospace;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--term-dim);
      padding-bottom: 8px;
    }

    .modal-title {
      color: var(--term-color);
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--term-dim);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }

    .close-btn:hover {
      color: var(--term-color);
    }

    /* Color Selection Group */
    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .setting-label {
      font-size: 11px;
      color: var(--term-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .color-options {
      display: flex;
      gap: 10px;
    }

    .color-btn {
      flex: 1;
      background-color: #121212;
      border: 1px solid #444;
      padding: 6px 0;
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.5px;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .color-btn[data-theme="green"] { color: #00ff00; }
    .color-btn[data-theme="amber"] { color: #ffb000; }
    .color-btn[data-theme="white"] { color: #e0e0e0; }

    .color-btn:hover {
      border-color: #888;
    }

    .color-btn.active {
      border-width: 2px;
    }
    .color-btn[data-theme="green"].active { border-color: #00ff00; background-color: rgba(0, 255, 0, 0.1); }
    .color-btn[data-theme="amber"].active { border-color: #ffb000; background-color: rgba(255, 176, 0, 0.1); }
    .color-btn[data-theme="white"].active { border-color: #e0e0e0; background-color: rgba(224, 224, 224, 0.1); }

    /* Retro Terminal Button Styling */
    .connect-btn {
      background-color: #0d0d0d;
      color: var(--term-color);
      border: 2px solid var(--term-color);
      padding: 10px 18px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-radius: 3px;
      cursor: pointer;
      box-shadow: 0 0 8px var(--term-glow);
      transition: all 0.15s ease-in-out;
      width: 100%;
    }

    .connect-btn:hover:not(:disabled) {
      background-color: var(--term-color);
      color: #000000;
      box-shadow: 0 0 15px var(--term-glow-bright);
    }

    .connect-btn:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.8);
    }

    .connect-btn:disabled {
      background-color: #1a1a1a;
      color: var(--term-dim);
      border-color: var(--term-dim);
      box-shadow: none;
      cursor: not-allowed;
    }

    .status-text { 
      font-size: 13px; 
      color: #888888; 
      letter-spacing: 0.5px;
    }

    .modal-footer {
      font-size: 11px;
      color: var(--term-dim);
      text-align: center;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="terminal-container" id="termFrame" tabindex="0">
    <svg viewBox="-10 -10 788 480.8" preserveAspectRatio="xMidYMid meet" id="svgTerm">
      <g id="textGroup"></g>
      <!-- Blinking Cursor -->
      <rect id="cursorElem" class="cursor" x="0" y="0" width="9.6" height="18" />
    </svg>
  </div>

  <!-- Connection Settings Modal Overlay -->
  <div class="modal-overlay" id="controlModal">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title">[ SYSTEM MENU ]</span>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>

      <div class="status-text" id="status">Status: Disconnected</div>

      <!-- Theme Selector -->
      <div class="setting-group">
        <span class="setting-label">Display Color</span>
        <div class="color-options">
          <button class="color-btn active" data-theme="green">GREEN</button>
          <button class="color-btn" data-theme="amber">AMBER</button>
          <button class="color-btn" data-theme="white">WHITE</button>
        </div>
      </div>

      <button class="connect-btn" id="connectBtn">Connect to Pico CP/M</button>

      <div class="modal-footer">Press [Ctrl+S] or [ESC] to toggle</div>
    </div>
  </div>

  <script>
    const connectBtn = document.getElementById('connectBtn');
    const statusText = document.getElementById('status');
    const termFrame = document.getElementById('termFrame');
    const textGroup = document.getElementById('textGroup');
    const cursorElem = document.getElementById('cursorElem');
    const controlModal = document.getElementById('controlModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const colorBtns = document.querySelectorAll('.color-btn');

    const COLS = 80;
    const ROWS = 24;
    const CHAR_WIDTH = 9.6;
    const CHAR_HEIGHT = 19.2;

    let port, writer, reader;
    let lines = Array(ROWS).fill(""); 
    let cursorCol = 0;
    let cursorRow = 0;

    // Theme Switcher Logic
    function setTheme(theme) {
      document.body.classList.remove('theme-amber', 'theme-white');
      if (theme === 'amber') document.body.classList.add('theme-amber');
      if (theme === 'white') document.body.classList.add('theme-white');

      colorBtns.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.theme === theme);
      });

      localStorage.setItem('terminal_theme', theme);
    }

    colorBtns.forEach(btn => {
      btn.addEventListener('click', () => setTheme(btn.dataset.theme));
    });

    // Load saved theme
    const savedTheme = localStorage.getItem('terminal_theme') || 'green';
    setTheme(savedTheme);

    function toggleModal(show) {
      if (show === undefined) {
        controlModal.classList.toggle('active');
      } else if (show) {
        controlModal.classList.add('active');
      } else {
        controlModal.classList.remove('active');
      }
    }

    closeModalBtn.addEventListener('click', () => toggleModal(false));

    function appendText(text) {
      for (let i = 0; i < text.length; i++) {
        const char = text[i];

        if (char === '\r') {
          cursorCol = 0;
        } else if (char === '\n') {
          cursorRow++;
          if (cursorRow >= ROWS) {
            lines.shift();
            lines.push("");
            cursorRow = ROWS - 1;
          }
        } else if (char === '\b') {
          if (cursorCol > 0) cursorCol--;
        } else {
          let currentLine = lines[cursorRow] || "";
          if (cursorCol < COLS) {
            lines[cursorRow] = currentLine.substring(0, cursorCol) + char + currentLine.substring(cursorCol + 1);
            cursorCol++;
          }
        }
      }
      render();
    }

    function render() {
      textGroup.innerHTML = '';

      lines.forEach((line, rowIdx) => {
        let padded = line.padEnd(COLS, ' ').substring(0, COLS);
        
        const textNode = document.createElementNS("http://www.w3.org/2000/svg", "text");
        textNode.setAttribute("x", "0");
        textNode.setAttribute("y", (rowIdx + 1) * CHAR_HEIGHT - 4);
        textNode.textContent = padded;
        textGroup.appendChild(textNode);
      });

      cursorElem.setAttribute("x", cursorCol * CHAR_WIDTH);
      cursorElem.setAttribute("y", cursorRow * CHAR_HEIGHT);
    }

    appendText("=== Pico CP/M Web Terminal (80x24) ===\r\n");
    appendText("Press Ctrl+S to open connection settings.\r\n");

    if (!('serial' in navigator)) {
      appendText("[ERROR] Web Serial API is NOT supported in this browser!\r\n");
    }

    connectBtn.addEventListener('click', async () => {
      if (!('serial' in navigator)) return;

      try {
        statusText.innerText = "Status: Prompting for port...";
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });

        statusText.innerText = "Status: Connected";
        statusText.style.color = "var(--term-color)";
        connectBtn.disabled = true;
        
        toggleModal(false);
        termFrame.focus();

        const textEncoder = new TextEncoderStream();
        textEncoder.readable.pipeTo(port.writable);
        writer = textEncoder.writable.getWriter();

        await writer.write('\r');

        const textDecoder = new TextDecoderStream();
        port.readable.pipeTo(textDecoder.writable);
        reader = textDecoder.readable.getReader();

        while (true) {
          const { value, done } = await reader.read();
          if (done) {
            reader.releaseLock();
            break;
          }
          if (value) {
            let clean = value.replace(/\x1b\[[0-9;]*[a-zA-Z]/g, '');
            appendText(clean);
          }
        }

      } catch (err) {
        console.error('Serial Error:', err);
        if (err.name === 'NotFoundError') {
          statusText.innerText = "Status: Selection canceled";
          statusText.style.color = "#aaa";
        } else {
          statusText.innerText = `Error: ${err.message}`;
          statusText.style.color = "#ff4444";
        }
        connectBtn.disabled = false;
      }
    });

    window.addEventListener('keydown', async (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
        e.preventDefault();
        toggleModal();
        return;
      }

      if (e.key === 'Escape' && controlModal.classList.contains('active')) {
        toggleModal(false);
        return;
      }

      if (controlModal.classList.contains('active')) return;

      if (!writer) return;

      let keyToSend = e.key;

      if (e.key === 'Enter') {
        keyToSend = '\r';
      } else if (e.key === 'Backspace') {
        keyToSend = '\b';
      } else if (e.key === 'Tab') {
        keyToSend = '\t';
        e.preventDefault();
      } else if (e.ctrlKey && e.key.length === 1) {
        const code = e.key.toUpperCase().charCodeAt(0) - 64;
        if (code >= 1 && code <= 26) {
          keyToSend = String.fromCharCode(code);
        }
      } else if (e.key.length > 1) {
        return;
      }

      try {
        await writer.write(keyToSend);
      } catch (err) {
        console.error("Write error:", err);
      }
    });
  </script>
</body>
</html>
