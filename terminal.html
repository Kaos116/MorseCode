<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pico CP/M Web Terminal (Viewport Scaled 80x24)</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 10px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    button {
      background-color: #007acc;
      color: white;
      border: none;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background-color: #005999; }
    button:disabled { background-color: #444; cursor: not-allowed; }
    #status { font-size: 14px; color: #aaa; }

    /* Outer Container tracking container queries */
    .terminal-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #000;
      border: 2px solid #333;
      border-radius: 6px;
      padding: 4px;
      container-type: inline-size; /* Enables Container Query Units (cqw) */
      overflow: hidden;
    }

    /* Fixed 80x24 grid box scaling font with container width */
    #terminal {
      background: #000;
      color: #00FF00;
      font-family: 'Courier New', Courier, monospace;
      line-height: 1.15;
      white-space: pre;
      overflow: hidden;
      outline: none;
      width: 100%;
      height: 100%;
      
      /* 
         80 characters across 100% container width.
         Courier New width-to-height ratio is ~0.60.
         (100cqw / 80) / 0.60 = ~2.08cqw font size.
      */
      font-size: 2.08cqw; 
    }

    .cursor {
      display: inline-block;
      width: 1ch;
      height: 1.15em;
      background-color: #00FF00;
      vertical-align: bottom;
      animation: blink 1s infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>

  <header>
    <button id="connectBtn">Connect to Pico CP/M</button>
    <span id="status">Disconnected</span>
  </header>

  <div class="terminal-wrapper">
    <div id="terminal" tabindex="0"></div>
  </div>

  <script>
    const connectBtn = document.getElementById('connectBtn');
    const statusText = document.getElementById('status');
    const termDiv = document.getElementById('terminal');

    const COLS = 80;
    const ROWS = 24;

    let port, writer, reader;
    let lines = Array(ROWS).fill(""); 
    let cursorCol = 0;
    let cursorRow = 0;

    function appendText(text) {
      for (let i = 0; i < text.length; i++) {
        const char = text[i];

        if (char === '\r') {
          cursorCol = 0;
        } else if (char === '\n') {
          cursorRow++;
          if (cursorRow >= ROWS) {
            lines.shift();
            lines.push("");
            cursorRow = ROWS - 1;
          }
        } else if (char === '\b') {
          if (cursorCol > 0) cursorCol--;
        } else {
          let currentLine = lines[cursorRow] || "";
          if (cursorCol < COLS) {
            lines[cursorRow] = currentLine.substring(0, cursorCol) + char + currentLine.substring(cursorCol + 1);
            cursorCol++;
          }
        }
      }
      render();
    }

    function render() {
      let displayOutput = lines.map((line, idx) => {
        let padded = line.padEnd(COLS, ' ').substring(0, COLS);
        if (idx === cursorRow) {
          return padded.substring(0, cursorCol) + '<span class="cursor"></span>' + padded.substring(cursorCol + 1);
        }
        return padded;
      }).join('\n');

      termDiv.innerHTML = displayOutput;
    }

    appendText("=== Pico CP/M Web Terminal (Native CSS Scaled) ===\r\n");

    if (!('serial' in navigator)) {
      appendText("[ERROR] Web Serial API is NOT supported in this browser!\r\n");
    }

    connectBtn.addEventListener('click', async () => {
      if (!('serial' in navigator)) return;

      try {
        statusText.innerText = "Status: Prompting for port...";
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });

        statusText.innerText = "Status: Connected";
        statusText.style.color = "#00ff00";
        connectBtn.disabled = true;
        termDiv.focus();

        const textEncoder = new TextEncoderStream();
        textEncoder.readable.pipeTo(port.writable);
        writer = textEncoder.writable.getWriter();

        await writer.write('\r');

        const textDecoder = new TextDecoderStream();
        port.readable.pipeTo(textDecoder.writable);
        reader = textDecoder.readable.getReader();

        while (true) {
          const { value, done } = await reader.read();
          if (done) {
            reader.releaseLock();
            break;
          }
          if (value) {
            let clean = value.replace(/\x1b\[[0-9;]*[a-zA-Z]/g, '');
            appendText(clean);
          }
        }

      } catch (err) {
        console.error('Serial Error:', err);
        if (err.name === 'NotFoundError') {
          statusText.innerText = "Status: Selection canceled";
          statusText.style.color = "#aaa";
        } else {
          statusText.innerText = `Error: ${err.message}`;
          statusText.style.color = "#ff4444";
        }
        connectBtn.disabled = false;
      }
    });

    window.addEventListener('keydown', async (e) => {
      if (!writer) return;

      let keyToSend = e.key;

      if (e.key === 'Enter') {
        keyToSend = '\r';
      } else if (e.key === 'Backspace') {
        keyToSend = '\b';
      } else if (e.key === 'Tab') {
        keyToSend = '\t';
        e.preventDefault();
      } else if (e.ctrlKey && e.key.length === 1) {
        const code = e.key.toUpperCase().charCodeAt(0) - 64;
        if (code >= 1 && code <= 26) {
          keyToSend = String.fromCharCode(code);
        }
      } else if (e.key.length > 1) {
        return;
      }

      try {
        await writer.write(keyToSend);
      } catch (err) {
        console.error("Write error:", err);
      }
    });
  </script>
</body>
</html>
