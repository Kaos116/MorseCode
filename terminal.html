<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pico CP/M Web Terminal</title>
  
  <!-- xterm.js CDN (unpkg) -->
  <link rel="stylesheet" href="https://unpkg.com/xterm@5.3.0/css/xterm.css" />
  <script src="https://unpkg.com/xterm@5.3.0/lib/xterm.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 15px;
    }
    button {
      background-color: #007acc;
      color: white;
      border: none;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background-color: #005999; }
    button:disabled { background-color: #444; cursor: not-allowed; }
    #status { font-size: 14px; color: #aaa; }
    #terminal-container {
      flex: 1;
      background: #000;
      padding: 5px;
      border-radius: 4px;
      border: 1px solid #333;
    }
  </style>
</head>
<body>

  <header>
    <button id="connectBtn">Connect to Pico CP/M</button>
    <span id="status">Disconnected</span>
  </header>

  <div id="terminal-container"></div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const connectBtn = document.getElementById('connectBtn');
      const statusText = document.getElementById('status');

      // Check if xterm loaded properly
      if (typeof Terminal === 'undefined') {
        alert('xterm.js failed to load. Please check your internet connection or ad blocker.');
        return;
      }

      // 1. Initialize VT100 Terminal
      const term = new Terminal({
        cursorBlink: true,
        cols: 80,
        rows: 24,
        theme: {
          background: '#000000',
          foreground: '#00FF00',
          cursor: '#00FF00'
        },
        fontFamily: 'Courier New, Courier, monospace',
        fontSize: 16
      });

      term.open(document.getElementById('terminal-container'));
      term.writeln('=== Pico CP/M Web Serial Terminal ===');

      if (!('serial' in navigator)) {
        term.writeln('\r\n\x1b[31m[ERROR] Web Serial API is NOT supported in this browser/context!\x1b[0m');
      } else {
        term.writeln('Ready. Click "Connect to Pico CP/M" to select your USB port.\r\n');
      }

      let port, reader, writer;

      // 2. Connect Button Event
      connectBtn.addEventListener('click', async () => {
        if (!('serial' in navigator)) {
          alert('Web Serial API is disabled or unsupported.');
          return;
        }

        try {
          statusText.innerText = "Status: Prompting for port...";
          
          port = await navigator.serial.requestPort();
          await port.open({ baudRate: 115200 });

          statusText.innerText = "Status: Connected";
          statusText.style.color = "#00ff00";
          connectBtn.disabled = true;

          const textDecoder = new TextDecoderStream();
          port.readable.pipeTo(textDecoder.writable);
          reader = textDecoder.readable.getReader();

          const textEncoder = new TextEncoderStream();
          textEncoder.readable.pipeTo(port.writable);
          writer = textEncoder.writable.getWriter();

          await writer.write('\r');

          term.onData(async (data) => {
            if (writer) await writer.write(data);
          });

          while (true) {
            const { value, done } = await reader.read();
            if (done) {
              reader.releaseLock();
              break;
            }
            if (value) term.write(value);
          }

        } catch (err) {
          console.error('Serial Error:', err);
          if (err.name === 'NotFoundError') {
            statusText.innerText = "Status: Selection canceled";
            statusText.style.color = "#aaa";
          } else {
            statusText.innerText = `Error: ${err.message}`;
            statusText.style.color = "#ff4444";
          }
          connectBtn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
