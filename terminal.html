<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pico CP/M Web Terminal (SVG Scaled 80x24)</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 10px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    button {
      background-color: #007acc;
      color: white;
      border: none;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background-color: #005999; }
    button:disabled { background-color: #444; cursor: not-allowed; }
    #status { font-size: 14px; color: #aaa; }

    /* Terminal Container fills remaining screen height */
    .terminal-container {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #000;
      border: 2px solid #333;
      border-radius: 6px;
      padding: 5px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* SVG auto-scales like an image to fill 100% width/height */
    svg {
      width: 100%;
      height: 100%;
      background-color: #000;
    }

    text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 16px;
      fill: #00FF00;
      white-space: pre;
    }

    .cursor {
      fill: #00FF00;
      animation: blink 1s infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>

  <header>
    <button id="connectBtn">Connect to Pico CP/M</button>
    <span id="status">Disconnected</span>
  </header>

  <div class="terminal-container" id="termFrame" tabindex="0">
    <!-- ViewBox locks an 80x24 coordinate system (80 cols * 9.6px width x 24 rows * 19.2px height) -->
    <svg viewBox="0 0 768 460" preserveAspectRatio="xMinYMin meet" id="svgTerm">
      <g id="textGroup"></g>
      <!-- Blinking Cursor -->
      <rect id="cursorElem" class="cursor" x="0" y="0" width="9.6" height="18" />
    </svg>
  </div>

  <script>
    const connectBtn = document.getElementById('connectBtn');
    const statusText = document.getElementById('status');
    const termFrame = document.getElementById('termFrame');
    const textGroup = document.getElementById('textGroup');
    const cursorElem = document.getElementById('cursorElem');

    const COLS = 80;
    const ROWS = 24;
    const CHAR_WIDTH = 9.6;
    const CHAR_HEIGHT = 19.2;

    let port, writer, reader;
    let lines = Array(ROWS).fill(""); 
    let cursorCol = 0;
    let cursorRow = 0;

    function appendText(text) {
      for (let i = 0; i < text.length; i++) {
        const char = text[i];

        if (char === '\r') {
          cursorCol = 0;
        } else if (char === '\n') {
          cursorRow++;
          if (cursorRow >= ROWS) {
            lines.shift();
            lines.push("");
            cursorRow = ROWS - 1;
          }
        } else if (char === '\b') {
          if (cursorCol > 0) cursorCol--;
        } else {
          let currentLine = lines[cursorRow] || "";
          if (cursorCol < COLS) {
            lines[cursorRow] = currentLine.substring(0, cursorCol) + char + currentLine.substring(cursorCol + 1);
            cursorCol++;
          }
        }
      }
      render();
    }

    function render() {
      // Clear SVG text elements
      textGroup.innerHTML = '';

      lines.forEach((line, rowIdx) => {
        let padded = line.padEnd(COLS, ' ').substring(0, COLS);
        
        const textNode = document.createElementNS("http://www.w3.org/2000/svg", "text");
        textNode.setAttribute("x", "0");
        textNode.setAttribute("y", (rowIdx + 1) * CHAR_HEIGHT - 4);
        textNode.textContent = padded;
        textGroup.appendChild(textNode);
      });

      // Update vector cursor coordinates
      cursorElem.setAttribute("x", cursorCol * CHAR_WIDTH);
      cursorElem.setAttribute("y", cursorRow * CHAR_HEIGHT);
    }

    appendText("=== Pico CP/M Web Terminal (SVG Vector Scaled) ===\r\n");

    if (!('serial' in navigator)) {
      appendText("[ERROR] Web Serial API is NOT supported in this browser!\r\n");
    }

    connectBtn.addEventListener('click', async () => {
      if (!('serial' in navigator)) return;

      try {
        statusText.innerText = "Status: Prompting for port...";
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });

        statusText.innerText = "Status: Connected";
        statusText.style.color = "#00ff00";
        connectBtn.disabled = true;
        termFrame.focus();

        const textEncoder = new TextEncoderStream();
        textEncoder.readable.pipeTo(port.writable);
        writer = textEncoder.writable.getWriter();

        await writer.write('\r');

        const textDecoder = new TextDecoderStream();
        port.readable.pipeTo(textDecoder.writable);
        reader = textDecoder.readable.getReader();

        while (true) {
          const { value, done } = await reader.read();
          if (done) {
            reader.releaseLock();
            break;
          }
          if (value) {
            let clean = value.replace(/\x1b\[[0-9;]*[a-zA-Z]/g, '');
            appendText(clean);
          }
        }

      } catch (err) {
        console.error('Serial Error:', err);
        if (err.name === 'NotFoundError') {
          statusText.innerText = "Status: Selection canceled";
          statusText.style.color = "#aaa";
        } else {
          statusText.innerText = `Error: ${err.message}`;
          statusText.style.color = "#ff4444";
        }
        connectBtn.disabled = false;
      }
    });

    window.addEventListener('keydown', async (e) => {
      if (!writer) return;

      let keyToSend = e.key;

      if (e.key === 'Enter') {
        keyToSend = '\r';
      } else if (e.key === 'Backspace') {
        keyToSend = '\b';
      } else if (e.key === 'Tab') {
        keyToSend = '\t';
        e.preventDefault();
      } else if (e.ctrlKey && e.key.length === 1) {
        const code = e.key.toUpperCase().charCodeAt(0) - 64;
        if (code >= 1 && code <= 26) {
          keyToSend = String.fromCharCode(code);
        }
      } else if (e.key.length > 1) {
        return;
      }

      try {
        await writer.write(keyToSend);
      } catch (err) {
        console.error("Write error:", err);
      }
    });
  </script>
</body>
</html>
